[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shardloom"
version = "0.6.1"
description = "A step-sequenced video instrument and editor: random shards of footage and photos, probability steps, music-driven colour and effects, titles, YouTube and Instagram sizes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "moderngl>=5.10", "imgui-bundle>=1.6", "Pillow>=10", "av>=14", "miniaudio>=1.60"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
shardloom = "shardloom.cli:main"

[tool.setuptools]
packages = ["shardloom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
