[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shardloom"
version = "0.1.0"
description = "A step-sequenced video instrument: random shards of footage, probability steps, music-driven colour and effects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "moderngl>=5.10", "imgui-bundle>=1.6", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
shardloom = "shardloom.cli:main"

[tool.setuptools]
packages = ["shardloom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
