name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Software OpenGL (EGL) for the render tests
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1 libgl1-mesa-dri libgles2
      - run: pip install -e '.[test]'
      - run: python -m pytest -v

  windows:
    name: Tests and build (Windows)
    runs-on: windows-2025
    env:
      # Mesa's software OpenGL, for the tests and the smoke run only; it is not shipped.
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e '.[test]' pyinstaller
      - name: Mesa software OpenGL next to python.exe (the runner has no GPU)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R pal1000/mesa-dist-win --pattern "*release-msvc.7z" --dir mesa
          7z x (Get-ChildItem mesa\*.7z).FullName -omesa\x -y | Out-Null
          $py = Split-Path (Get-Command python).Source
          Copy-Item mesa\x\x64\*.dll $py
          python -c "import moderngl; print(moderngl.create_standalone_context().info['GL_RENDERER'])"
      - run: python -m pytest -v
      - name: Build Shardloom.exe
        working-directory: packaging
        run: pyinstaller --noconfirm --clean --distpath ..\dist --workpath ..\build shardloom.spec
      - name: Smoke test the built program
        shell: pwsh
        run: |
          python tools\make_test_media.py smoke\media
          # A copy with software OpenGL beside it, so the window can open here.
          Copy-Item -Recurse dist\Shardloom smoke\app
          Copy-Item mesa\x\x64\*.dll smoke\app
          Set-Location smoke
          app\Shardloom.exe --version
          python -c "from PIL import Image; Image.radial_gradient('L').convert('RGB').save('media/photo.jpg')"
          app\Shardloom.exe new proj --music media\song.wav --video media\ball.mp4 media\still.mp4 media\photo.jpg --count 12 --seed 1 --format small
          if ($LASTEXITCODE) { exit 1 }
          python -c "from shardloom.sequencer import Project, Title; p = Project.load('proj'); p.titles = [Title('Shardloom', 'smoke test', duration=5)]; p.save('proj')"
          app\Shardloom.exe render proj -o out.mp4 --start 8 --end 14
          if ($LASTEXITCODE) { exit 1 }
          python -c "from shardloom.media import probe; i = probe('out.mp4'); print(i); assert i['audio'] and abs(i['duration'] - 6) < 0.2"
          app\Shardloom.exe render proj -o reel.mp4 --format instagram-reel --start 8 --end 10 --quality draft
          if ($LASTEXITCODE) { exit 1 }
          python -c "from shardloom.media import probe; i = probe('reel.mp4'); print(i); assert i['video']['width'] == 1080 and i['video']['height'] == 1920"
          app\Shardloom.exe edit proj --screenshot editor.png --after 3
          if (-not (Test-Path editor.png)) { Write-Error "the editor did not open"; exit 1 }
          app\Shardloom.exe edit proj --layout Perform --screenshot perform.png --after 3
          if (-not (Test-Path perform.png)) { Write-Error "the instrument did not open"; exit 1 }
          app\Shardloom.exe pack proj -o proj.zip
          if ($LASTEXITCODE) { exit 1 }
          app\Shardloom.exe unpack proj.zip unpacked
          if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path unpacked\pool\pool.json)) { Write-Error "unpacking did not rebuild the shards"; exit 1 }
      - uses: actions/upload-artifact@v5
        with:
          name: smoke-test
          path: |
            smoke/editor.png
            smoke/perform.png
            smoke/out.mp4
      - name: Zip
        shell: pwsh
        run: |
          $version = python -c "import shardloom; print(shardloom.__version__)"
          Copy-Item README.md, LICENSE dist\Shardloom
          Compress-Archive dist\Shardloom "Shardloom-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: Shardloom-windows-x64
          path: Shardloom-*-windows-x64.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: Shardloom-windows-x64
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Shardloom-*-windows-x64.zip \
            --title "Shardloom ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
